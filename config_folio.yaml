# Sample configuration file for the Reasoning System with Azure OpenAI
# Copy this file and modify the values according to your Azure OpenAI setup

# Required fields
dataset: "FOLIO"                  # Dataset name to use
test_file: "./data/FOLIO/dev.json"         # Test file to use
reasoning_method: "two-step"        # The reasoning method to use: cot, one-step, two-step
api_key: ""                         # Leave empty for Azure OpenAI with Entra ID authentication
model: "gpt-4"                     # Azure OpenAI deployment name (e.g., gpt-4o, gpt-4, etc.)
fix_model: "gpt-4"                 # Model name for fixing/repair operations
temperature: 0                      # Temperature for model generation (0.0 to 1.0)
max_repairs: 3                      # Maximum number of repair attempts
test_delay: 1                       # Delay between test cases in seconds
prompt_path: "./prompts/FOLIO-prompts-two-step-partition/"
shots: "two"                        # Number of shots for few-shot learning
desired_indices: [0]                # Desired indices to use

# Azure OpenAI specific configuration
azure_endpoint: "" 
azure_deployment: "gpt-4"          # Your Azure OpenAI deployment name
azure_managed_identity_client_id: ""  # For managed identity authentication 
