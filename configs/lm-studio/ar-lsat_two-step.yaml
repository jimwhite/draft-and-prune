# AR-LSAT — Two-step Draft & Prune (D&P)
provider: "openai-compatible"
dataset: "AR-LSAT"
model: "qwen/qwen3-coder-next"
plan_model: "qwen/qwen3-coder-next"
code_model: "qwen/qwen3-coder-next"
test_file: "data/AR-LSAT/blob/main/complete_lsat_data/test_ar.json"
prompt_path: "prompts-all-3-shot-aligned/AR-LSAT-prompts-two-step-partition"
reasoning_method: "two-step"
shots: "three"
# desired_indices: [1, 11, 21, 31, 41, 51, 61, 71, 81, 91, 101, 111, 121, 131, 141, 151, 161, 171, 181, 191, 201, 211]
desired_indices: [4, 14, 24, 34, 44, 54, 64, 74, 84, 94, 104, 114, 124, 134, 144, 154, 164, 174, 184, 194, 204, 214]
num_paths: 15

api_key: "lm-studio"
openai_compatible_api_key: "lm-studio"
openai_compatible_base_url: "http://host.docker.internal:1234/v1"
openai_compatible_default_extra_body: null
openai_compatible_extra_body: null
max_retries: 3
test_delay: 1
num_processes: 3

plan_temp: 1.0
code_temp: 0
max_repairs: 3
results_root: "./results"

# Thinking token control
strip_thinking: true
