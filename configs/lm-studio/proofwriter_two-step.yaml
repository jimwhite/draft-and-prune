# ProofWriter — Two-step Draft-and-Prune
provider: "openai-compatible"
dataset: "ProofWriter"
model: "qwen/qwen3-coder-next"
plan_model: "qwen/qwen3-coder-next"
code_model: "qwen/qwen3-coder-next"
test_file: "data/ProofWriter/dev.json"
prompt_path: "prompts-all-3-shot-aligned/ProofWriter-prompts-two-step-partition"
reasoning_method: "two-step"
shots: "three"
desired_indices: [1, 11, 21, 31, 41, 51, 61, 71, 81, 91, 101, 111, 121, 131, 141, 151, 161, 171, 181, 191, 201, 211]
num_paths: 5

api_key: "lm-studio"
openai_compatible_api_key: "lm-studio"
openai_compatible_base_url: "http://host.docker.internal:1234/v1"
openai_compatible_default_extra_body: null
openai_compatible_extra_body: null
max_retries: 3
test_delay: 1
num_processes: 3

plan_temp: 1.0
code_temp: 0
max_repairs: 3
results_root: "./results"

# Thinking token control
strip_thinking: true
